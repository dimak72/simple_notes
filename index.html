<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Notes</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell" aria-live="polite">
      <aside id="projectSidebar" class="sidebar" aria-label="Projects">
        <div class="brand-block">
          <p class="eyebrow">Local workspace</p>
          <h1>Simple Notes</h1>
        </div>

        <form id="projectForm" class="project-form">
          <label for="projectName">New project</label>
          <div class="inline-field">
            <input id="projectName" name="projectName" type="text" autocomplete="off" placeholder="Roadmap notes" />
            <button type="submit">Create</button>
          </div>
        </form>

        <div class="sidebar-section-title">Projects</div>
        <div id="projectList" class="project-list"></div>
      </aside>

      <main class="workspace">
        <header class="workspace-header">
          <div>
            <p id="activeProjectMeta" class="eyebrow">No project selected</p>
            <h2 id="activeProjectName">Pick or create a project</h2>
          </div>

          <div class="toolbar" aria-label="Workspace tools">
            <input id="searchInput" class="search-input" type="search" placeholder="Search notes" disabled />
            <button id="addNoteButton" type="button" disabled>Add note</button>
            <button id="deleteProjectButton" class="danger-button" type="button" disabled>Delete project</button>
          </div>
        </header>

        <div id="statusBanner" class="status-banner" hidden></div>

        <section id="canvasSurface" class="canvas-surface" aria-label="Note canvas">
          <div id="emptyState" class="empty-state">
            <h3>No project selected</h3>
            <p>Create or select a project to start arranging notes.</p>
          </div>
          <div id="canvasContent" class="canvas-content"></div>
          <button id="fullscreenButton" class="fullscreen-control" type="button" aria-label="Enter full screen mode">
            <svg aria-hidden="true" viewBox="0 0 48 48" focusable="false">
              <g class="expand-icon">
                <path d="M22 22 L10 10" />
                <path d="M10 10 H23" />
                <path d="M10 10 V23" />
                <path d="M26 26 L38 38" />
                <path d="M38 38 H25" />
                <path d="M38 38 V25" />
              </g>
              <g class="restore-icon">
                <path d="M9 9 L21 21" />
                <path d="M21 21 H8" />
                <path d="M21 21 V8" />
                <path d="M39 39 L27 27" />
                <path d="M27 27 H40" />
                <path d="M27 27 V40" />
              </g>
            </svg>
          </button>
          <div class="zoom-controls" aria-label="Canvas zoom controls">
            <button id="zoomInButton" type="button" aria-label="Zoom in" disabled>+</button>
            <button id="recenterButton" class="recenter-control" type="button" aria-label="Recenter canvas" disabled>⌖</button>
            <button id="zoomOutButton" type="button" aria-label="Zoom out" disabled>-</button>
          </div>
        </section>
      </main>
    </div>

    <script src="assets/app.js"></script>
  </body>
</html>
